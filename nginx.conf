user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;
daemon off;

events {
    worker_connections 161072;
    multi_accept on;
    use epoll;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 120;
    keepalive_requests 100000;
    reset_timedout_connection on;

    client_max_body_size 0;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 3600;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    resolver 1.1.1.1 223.5.5.5 8.8.8.8 valid=86400s;
    resolver_timeout 1s;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 10;
    proxy_send_timeout 3600;
    proxy_read_timeout 3600;
    proxy_socket_keepalive on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ssl_session_reuse on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstreams
    upstream trojan_ws       { server [::1]:10001; keepalive 512; }
    upstream vless_ws        { server [::1]:10002; keepalive 512; }
    upstream shadowsocks_ws  { server [::1]:10003; keepalive 512; }
    upstream vmess_ws        { server [::1]:10004; keepalive 512; }
    upstream trojan_hu       { server [::1]:11001; keepalive 512; }
    upstream vless_hu        { server [::1]:11002; keepalive 512; }
    upstream shadowsocks_hu  { server [::1]:11003; keepalive 512; }
    upstream vmess_hu        { server [::1]:11004; keepalive 512; }

    server {
        listen 8080 default_server reuseport backlog=65535;
        listen [::]:8080 default_server reuseport backlog=65535;
        server_name firebase-settings.crashlytics.com;

        # Health check — GCP startup probe
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # SSH over WebSocket — /CxlvinSSH
        location ^~ /CxlvinSSH {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host firebase-settings.crashlytics.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # Xray WebSocket Paths
        location ^~ /CxlvinTRWS {
            proxy_pass http://trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinVlWS {
            proxy_pass http://vless_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinSSWS {
            proxy_pass http://shadowsocks_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinVMWS {
            proxy_pass http://vmess_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Xray HTTP Upgrade Paths
        location ^~ /CxlvinTRHU {
            proxy_pass http://trojan_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinVlHU {
            proxy_pass http://vless_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinSSHU {
            proxy_pass http://shadowsocks_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinVMHU {
            proxy_pass http://vmess_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Xray XHTTP Paths
        location ^~ /CxlvinVlXH {
            proxy_pass http://[::1]:10009;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinTRXH {
            proxy_pass http://[::1]:10010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinVMXH {
            proxy_pass http://[::1]:10011;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location ^~ /CxlvinSSXH {
            proxy_pass http://[::1]:10012;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Decoy / Frontend
        location / {
            proxy_pass https://ubiquitous-fishstick.d4em0n35.workers.dev;
            proxy_set_header Host ubiquitous-fishstick.d4em0n35.workers.dev;
            proxy_set_header Referer https://www.google.com/;
            proxy_set_header Origin https://www.cloudflare.com/;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
